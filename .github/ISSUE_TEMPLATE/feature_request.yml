name: 功能建议
description: 建议符合轻量、纯本地定位的新能力
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景，而不只是方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: boundaries
    attributes:
      label: 产品边界
      options:
        - label: 该建议可以离线工作，不依赖账号、云端同步或协作服务。
          required: true
