name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿上传包含真实任务、附件或个人信息的截图和数据。
  - type: input
    id: macos-version
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 15.0
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: FocusList 版本或提交
      placeholder: 例如 main / 11579bc
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序描述操作步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可添加已脱敏的日志、截图或其他上下文。
